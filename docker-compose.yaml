      # Which measurement-control law this deployment operates under. Required:
      # the service refuses to start without it, because an eligibility verdict
      # cites a statute and the wrong one is worse than none. One of
      # IN_LEGAL_METROLOGY, EU_MID, US_NIST_HB44, KE_WEIGHTS_MEASURES, or NONE.
