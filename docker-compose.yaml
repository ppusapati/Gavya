version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dairy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "8000:8080"
    environment:
      SERVICE_NAME: gateway-service
      SERVER_ADDR: ":8080"
      CATTLE_SERVICE_URL: "http://cattle-service:8080"
      MILK_SERVICE_URL: "http://milk-service:8080"
      BREEDING_SERVICE_URL: "http://breeding-service:8080"
      HEALTH_SERVICE_URL: "http://health-service:8080"
      FEED_SERVICE_URL: "http://feed-service:8080"
      FARM_SERVICE_URL: "http://farm-service:8080"
      CATTLE_MARKET_SERVICE_URL: "http://cattle-market-service:8080"
      PRODUCT_CATALOG_SERVICE_URL: "http://product-catalog-service:8080"
      INVENTORY_SERVICE_URL: "http://inventory-service:8080"
      ORDER_SERVICE_URL: "http://order-service:8080"
      BILLING_SERVICE_URL: "http://billing-service:8080"
      TENANT_SERVICE_URL: "http://tenant-service:8080"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
      REPORTING_SERVICE_URL: "http://reporting-service:8080"
      AUDIT_SERVICE_URL: "http://audit-service:8080"
      FILE_SERVICE_URL: "http://file-service:8080"
      INGESTION_SERVICE_URL: "http://ingestion-service:8091"
      CANONICAL_SERVICE_URL: "http://canonical-service:8093"
      OBSERVATION_SERVICE_URL: "http://observation-service:8092"
      POOLING_SERVICE_URL: "http://pooling-service:8094"
      SHADOW_SETTLEMENT_SERVICE_URL: "http://shadow-settlement-service:8090"
    depends_on:
      - tenant-service
      - cattle-service

  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: tenant-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  cattle-service:
    build:
      context: .
      dockerfile: services/cattle-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SERVICE_NAME: cattle-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  milk-service:
    build:
      context: .
      dockerfile: services/milk-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      SERVICE_NAME: milk-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  breeding-service:
    build:
      context: .
      dockerfile: services/breeding-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      SERVICE_NAME: breeding-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  health-service:
    build:
      context: .
      dockerfile: services/health-service/Dockerfile
    ports:
      - "8084:8080"
    environment:
      SERVICE_NAME: health-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  feed-service:
    build:
      context: .
      dockerfile: services/feed-service/Dockerfile
    ports:
      - "8085:8080"
    environment:
      SERVICE_NAME: feed-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  farm-service:
    build:
      context: .
      dockerfile: services/farm-service/Dockerfile
    ports:
      - "8086:8080"
    environment:
      SERVICE_NAME: farm-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  cattle-market-service:
    build:
      context: .
      dockerfile: services/cattle-market-service/Dockerfile
    ports:
      - "8087:8080"
    environment:
      SERVICE_NAME: cattle-market-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  product-catalog-service:
    build:
      context: .
      dockerfile: services/product-catalog-service/Dockerfile
    ports:
      - "8088:8080"
    environment:
      SERVICE_NAME: product-catalog-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    ports:
      - "8089:8080"
    environment:
      SERVICE_NAME: inventory-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    ports:
      - "8090:8080"
    environment:
      SERVICE_NAME: order-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    ports:
      - "8091:8080"
    environment:
      SERVICE_NAME: billing-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8092:8080"
    environment:
      SERVICE_NAME: notification-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting-service/Dockerfile
    ports:
      - "8093:8080"
    environment:
      SERVICE_NAME: reporting-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "8094:8080"
    environment:
      SERVICE_NAME: audit-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  file-service:
    build:
      context: .
      dockerfile: services/file-service/Dockerfile
    ports:
      - "8095:8080"
    environment:
      SERVICE_NAME: file-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
      STORAGE_PROVIDER: local
      STORAGE_BUCKET: /data/uploads
    volumes:
      - file_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # --- Integrity layer -------------------------------------------------------

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    ports:
      - "8091:8091"
    environment:
      SERVICE_NAME: ingestion-service
      SERVER_ADDR: ":8091"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  observation-service:
    build:
      context: .
      dockerfile: services/observation-service/Dockerfile
    ports:
      - "8092:8092"
    environment:
      SERVICE_NAME: observation-service
      SERVER_ADDR: ":8092"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
      UNCERTAINTY_ML_URL: "http://uncertainty-service:9102"
      ANOMALY_ML_URL: "http://anomaly-service:9101"
    depends_on:
      postgres:
        condition: service_healthy

  canonical-service:
    build:
      context: .
      dockerfile: services/canonical-service/Dockerfile
    ports:
      - "8093:8093"
    environment:
      SERVICE_NAME: canonical-service
      SERVER_ADDR: ":8093"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  pooling-service:
    build:
      context: .
      dockerfile: services/pooling-service/Dockerfile
    ports:
      - "8094:8094"
    environment:
      SERVICE_NAME: pooling-service
      SERVER_ADDR: ":8094"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  shadow-settlement-service:
    build:
      context: .
      dockerfile: services/shadow-settlement-service/Dockerfile
    ports:
      - "8090:8090"
    environment:
      SERVICE_NAME: shadow-settlement-service
      SERVER_ADDR: ":8090"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
      # Clearing this disables the advisory call; deterministic classification
      # is unaffected and every divergence is still classified.
      DIVERGENCE_ML_URL: "http://divergence-service:9104"
      DIVERGENCE_ML_TIMEOUT: "3"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Rust ML tier ----------------------------------------------------------
  # Reached only over the network. No database of their own: they hold no state
  # and are safe to restart or scale independently of the Go services.

  anomaly-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        SERVICE: anomaly-service
    ports:
      - "9101:9101"
    environment:
      LISTEN_ADDR: "0.0.0.0:9101"
      LOG_LEVEL: info

  uncertainty-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        SERVICE: uncertainty-service
    ports:
      - "9102:9102"
    environment:
      LISTEN_ADDR: "0.0.0.0:9102"
      LOG_LEVEL: info

  reconciliation-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        SERVICE: reconciliation-service
    ports:
      - "9103:9103"
    environment:
      LISTEN_ADDR: "0.0.0.0:9103"
      LOG_LEVEL: info

  divergence-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        SERVICE: divergence-service
    ports:
      - "9104:9104"
    environment:
      LISTEN_ADDR: "0.0.0.0:9104"
      LOG_LEVEL: info

volumes:
  postgres_data:
  file_uploads:
