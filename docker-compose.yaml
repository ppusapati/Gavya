        condition: service_healthy

  file-service:
    build: ./services/file-service
    ports:
      - "8095:8080"
    environment:
      SERVICE_NAME: file-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
      STORAGE_PROVIDER: local
      STORAGE_BUCKET: /data/uploads
    volumes:
      - file_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  file_uploads:
