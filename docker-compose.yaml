version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    # max_connections, stated rather than defaulted, and the number is checked.
    #
    # PostgreSQL's own default is 100. Twenty-eight services open a pool against
    # this one database, and pgxpool's default pool size is the greater of four
    # and the number of CPUs — so on a four-core host the platform's ceiling was
    # 112 against a limit of 100, and on an eight-core host 224. Neither number
    # was chosen by anybody; they were two defaults multiplying, and what it
    # looks like when they meet is "FATAL: sorry, too many clients already" from
    # whichever services ask last, during the morning collection.
    #
    # 300 = 28 pools x tenantdb.MaxConns (8) + tenantdb.Headroom (40), rounded
    # up. The headroom is for the migration runner, a backup, and somebody with
    # psql open trying to find out why the platform is unhappy — which is
    # precisely when every connection is taken.
    #
    # TestThePoolsFitTheDatabase in gateway-service does that arithmetic against
    # this line and fails the build if it stops adding up.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      # No default. A password baked into a compose file is a password that
      # reaches production, because the file is what gets copied.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: dairy
      # Read by the init script below, which sets it on the application role.
      GAVYA_APP_PASSWORD: ${GAVYA_APP_PASSWORD:?set GAVYA_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the tables and applies tenant isolation, once, before any
      # service can connect. Without this the database comes up empty.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
      # The schemas are read from the repository rather than copied, so a new
      # service's tables cannot be left behind by a stale copy.
      - ./services:/repo/services:ro
      - ./libs:/repo/libs:ro
      - ./pkg/database/schema:/repo/pkg/database/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "8000:8080"
    environment:
      SERVICE_NAME: gateway-service
      # The entry point, and therefore the span every trace starts with. A
      # gateway that is not traced leaves every waterfall beginning at the
      # second hop, with nothing saying what was asked for.
      GAVYA_TRACE_ENDPOINT: "http://jaeger:4318"
      SERVER_ADDR: ":8080"
      IDENTITY_SERVICE_URL: "http://identity-service:8080"
      CATTLE_SERVICE_URL: "http://cattle-service:8080"
      MILK_SERVICE_URL: "http://milk-service:8080"
      BREEDING_SERVICE_URL: "http://breeding-service:8080"
      HEALTH_SERVICE_URL: "http://health-service:8080"
      FEED_SERVICE_URL: "http://feed-service:8080"
      FARM_SERVICE_URL: "http://farm-service:8080"
      CATTLE_MARKET_SERVICE_URL: "http://cattle-market-service:8080"
      PRODUCT_CATALOG_SERVICE_URL: "http://product-catalog-service:8080"
      INVENTORY_SERVICE_URL: "http://inventory-service:8080"
      ORDER_SERVICE_URL: "http://order-service:8080"
      BILLING_SERVICE_URL: "http://billing-service:8080"
      TENANT_SERVICE_URL: "http://tenant-service:8080"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8080"
      REPORTING_SERVICE_URL: "http://reporting-service:8080"
      AUDIT_SERVICE_URL: "http://audit-service:8080"
      FILE_SERVICE_URL: "http://file-service:8080"
      INGESTION_SERVICE_URL: "http://ingestion-service:8091"
      CANONICAL_SERVICE_URL: "http://canonical-service:8093"
      OBSERVATION_SERVICE_URL: "http://observation-service:8092"
      POOLING_SERVICE_URL: "http://pooling-service:8094"
      BALANCE_SERVICE_URL: "http://balance-service:8095"
      SHADOW_SETTLEMENT_SERVICE_URL: "http://shadow-settlement-service:8090"
      PROCUREMENT_SERVICE_URL: "http://procurement-service:8103"
      SETTLEMENT_SERVICE_URL: "http://settlement-service:8104"
      MATERIAL_SERVICE_URL: "http://material-service:8105"
      LABORATORY_SERVICE_URL: "http://laboratory-service:8106"
      PRODUCTION_SERVICE_URL: "http://production-service:8107"
    depends_on:
      - tenant-service
      - cattle-service

  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: tenant-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://gavya_app:${GAVYA_APP_PASSWORD:?set GAVYA_APP_PASSWORD}@postgres:5432/dairy?sslmode=disable"
      GAVYA_TRACE_ENDPOINT: "http://jaeger:4318"
      # Not encrypted, and this says so. The PostgreSQL is a container beside this one on a private compose network. Point DATABASE_URL at a database anywhere else and this line has to go: set sslmode=verify-full instead.
      GAVYA_INSECURE_DATABASE: "plaintext-to-the-database-is-acceptable-here"
    depends_on:
      postgres:
        condition: service_healthy

