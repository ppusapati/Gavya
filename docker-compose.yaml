    build:
      context: .
      dockerfile: services/production-service/Dockerfile
    ports:
      - "8107:8107"
    environment:
      SERVICE_NAME: production-service
      SERVER_ADDR: ":8107"
      DATABASE_URL: "postgres://gavya_app:${GAVYA_APP_PASSWORD:?set GAVYA_APP_PASSWORD}@postgres:5432/dairy?sslmode=disable"
      GAVYA_TRACE_ENDPOINT: "http://jaeger:4318"
      # Not encrypted, and this says so. The PostgreSQL is a container beside this one on a private compose network. Point DATABASE_URL at a database anywhere else and this line has to go: set sslmode=verify-full instead.
      GAVYA_INSECURE_DATABASE: "plaintext-to-the-database-is-acceptable-here"
    depends_on:
      postgres:
        condition: service_healthy

  pooling-service:
    build:
      context: .
      dockerfile: services/pooling-service/Dockerfile
    ports:
      - "8094:8094"
    environment:
      SERVICE_NAME: pooling-service
      SERVER_ADDR: ":8094"
      DATABASE_URL: "postgres://gavya_app:${GAVYA_APP_PASSWORD:?set GAVYA_APP_PASSWORD}@postgres:5432/dairy?sslmode=disable"
      GAVYA_TRACE_ENDPOINT: "http://jaeger:4318"
      # Not encrypted, and this says so. The PostgreSQL is a container beside this one on a private compose network. Point DATABASE_URL at a database anywhere else and this line has to go: set sslmode=verify-full instead.
      GAVYA_INSECURE_DATABASE: "plaintext-to-the-database-is-acceptable-here"
    depends_on:
      postgres:
        condition: service_healthy

  balance-service:
    build:
      context: .
      dockerfile: services/balance-service/Dockerfile
    ports:
      - "8095:8095"
    environment:
      SERVICE_NAME: balance-service
      SERVER_ADDR: ":8095"
      DATABASE_URL: "postgres://gavya_app:${GAVYA_APP_PASSWORD:?set GAVYA_APP_PASSWORD}@postgres:5432/dairy?sslmode=disable"
      GAVYA_TRACE_ENDPOINT: "http://jaeger:4318"
      # Not encrypted, and this says so. The PostgreSQL is a container beside this one on a private compose network. Point DATABASE_URL at a database anywhere else and this line has to go: set sslmode=verify-full instead.
      GAVYA_INSECURE_DATABASE: "plaintext-to-the-database-is-acceptable-here"
      RECONCILIATION_ML_URL: "http://reconciliation-service:9103"
      RECONCILIATION_ML_TIMEOUT: "5"
    depends_on:
      postgres:
        condition: service_healthy

  shadow-settlement-service:
    build:
      context: .
      dockerfile: services/shadow-settlement-service/Dockerfile
    ports:
      - "8090:8090"
    environment:
      SERVICE_NAME: shadow-settlement-service
      SERVER_ADDR: ":8090"
      DATABASE_URL: "postgres://gavya_app:${GAVYA_APP_PASSWORD:?set GAVYA_APP_PASSWORD}@postgres:5432/dairy?sslmode=disable"
      GAVYA_TRACE_ENDPOINT: "http://jaeger:4318"
      # Not encrypted, and this says so. The PostgreSQL is a container beside this one on a private compose network. Point DATABASE_URL at a database anywhere else and this line has to go: set sslmode=verify-full instead.
      GAVYA_INSECURE_DATABASE: "plaintext-to-the-database-is-acceptable-here"
      # Clearing this disables the advisory call; deterministic classification
      # is unaffected and every divergence is still classified.
      DIVERGENCE_ML_URL: "http://divergence-service:9104"
      DIVERGENCE_ML_TIMEOUT: "3"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Rust ML tier ----------------------------------------------------------
  # Reached only over the network. No database of their own: they hold no state
  # and are safe to restart or scale independently of the Go services.

  anomaly-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        SERVICE: anomaly-service
    ports:
      - "9101:9101"
    environment:
      LISTEN_ADDR: "0.0.0.0:9101"
      LOG_LEVEL: info

  uncertainty-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        SERVICE: uncertainty-service
    ports:
      - "9102:9102"
    environment:
      LISTEN_ADDR: "0.0.0.0:9102"
      LOG_LEVEL: info

  reconciliation-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        SERVICE: reconciliation-service
    ports:
      - "9103:9103"
    environment:
      LISTEN_ADDR: "0.0.0.0:9103"
      LOG_LEVEL: info

  divergence-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
      args:
        SERVICE: divergence-service
    ports:
      - "9104:9104"
    environment:
      LISTEN_ADDR: "0.0.0.0:9104"
      LOG_LEVEL: info

  # Where the traces go.
  #
  # Jaeger's all-in-one image, which accepts OTLP over HTTP on 4318 and serves
  # its own interface on 16686. One container because this is the compose shape:
  # a society running the platform on one server wants to be able to look at a
  # slow settlement, not to operate a tracing cluster.
  #
  # Traces are held in memory here and are gone when the container restarts.
  # That is the right trade for this shape and the wrong one for a real
  # deployment; point GAVYA_TRACE_ENDPOINT at a collector with storage behind it
  # and this container is not needed.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # The reader. Every service has served /metrics since readiness was added and
  # nothing read them, which made the platform's observability a page that
  # existed. Its scrape list is checked against libs/integrity/ports by a test,
  # so a service added and not scraped fails the build rather than going quietly
  # unwatched.
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Fifteen days. Long enough to look at last fortnight's settlement run,
      # short enough that nobody has to think about the disk.
      - --storage.tsdb.retention.time=15d

volumes:
  postgres_data:
  file_uploads:
  prometheus_data:
