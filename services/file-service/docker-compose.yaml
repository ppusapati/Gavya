version: "3.9"
services:
  file-service:
    build: .
    ports:
      - "8095:8095"
    environment:
      SERVICE_NAME: file-service
      SERVER_ADDR: :8095
      DATABASE_URL: postgres://postgres:secret@postgres:5432/dairy?sslmode=disable
      STORAGE_PROVIDER: local
      STORAGE_BUCKET: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dairy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  uploads:
