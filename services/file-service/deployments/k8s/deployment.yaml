apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  labels:
    app: file-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
        - name: file-service
          image: file-service:latest
          ports:
            - containerPort: 8095
          envFrom:
            - configMapRef:
                name: file-service-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8095
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
spec:
  selector:
    app: file-service
  ports:
    - port: 8095
      targetPort: 8095
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
data:
  SERVICE_NAME: file-service
  SERVER_ADDR: ":8095"
  DATABASE_URL: postgres://postgres:secret@postgres:5432/dairy?sslmode=disable
  STORAGE_PROVIDER: local
  STORAGE_BUCKET: /data/uploads
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
