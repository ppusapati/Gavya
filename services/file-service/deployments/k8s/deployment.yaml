apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  labels:
    app: file-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      annotations:
        # Discovered by a cluster Prometheus. The compose shape uses
        # deploy/monitoring/prometheus.yml instead; a test checks that a
        # service scraped in one shape is scraped in the other, because one
        # watched in testing and unwatched in production is the worse half.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8095"
      labels:
        app: file-service
    spec:
      containers:
        - name: file-service
          image: file-service:latest
          ports:
            - containerPort: 8095
          envFrom:
            - configMapRef:
                name: file-service-config
            - secretRef:
                name: file-service-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8095
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
spec:
  selector:
    app: file-service
  ports:
    - port: 8095
      targetPort: 8095
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
data:
  SERVICE_NAME: file-service
  SERVER_ADDR: ":8095"
  # DATABASE_URL is deliberately not here.
  #
  # It was, complete with the password, in a ConfigMap — which is not a
  # secret store: it is readable by anything in the namespace that can read
  # ConfigMaps, it lands in `kubectl describe` output, and it is the first
  # thing copied into a git repository. It also carried sslmode=disable, so
  # the connection it described was unencrypted.
  #
  # It now comes from the Secret file-service-secret, which the deployment
  # mounts beside this. Create it with a URL that verifies the server:
  #
  #   kubectl create secret generic file-service-secret \
  #     --from-literal=DATABASE_URL='postgres://gavya_app:PASSWORD@postgres:5432/dairy?sslmode=verify-full&sslrootcert=/etc/ssl/certs/pg-ca.crt'
  #
  # Anything that can end up in plaintext — disable, allow, prefer, or no
  # sslmode at all — is refused at startup unless the deployment states the
  # case with GAVYA_INSECURE_DATABASE.
  STORAGE_PROVIDER: local
  STORAGE_BUCKET: /data/uploads
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
