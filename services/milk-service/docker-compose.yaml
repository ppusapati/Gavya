version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dairy
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  milk-service:
    build:
      context: ../..
      dockerfile: services/milk-service/Dockerfile
    ports: ["8082:8080"]
    environment:
      SERVICE_NAME: milk-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
      # Not encrypted, and this says so. The PostgreSQL is a container beside this one on a private compose network. Point DATABASE_URL at a database anywhere else and this line has to go: set sslmode=verify-full instead.
      GAVYA_INSECURE_DATABASE: "plaintext-to-the-database-is-acceptable-here"
    depends_on:
      postgres:
        condition: service_healthy
