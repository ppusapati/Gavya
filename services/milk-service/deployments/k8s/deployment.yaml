apiVersion: apps/v1
kind: Deployment
metadata:
  name: milk-service
  labels:
    app: milk-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: milk-service
  template:
    metadata:
      annotations:
        # Discovered by a cluster Prometheus. The compose shape uses
        # deploy/monitoring/prometheus.yml instead; a test checks that a
        # service scraped in one shape is scraped in the other, because one
        # watched in testing and unwatched in production is the worse half.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
      labels:
        app: milk-service
    spec:
      containers:
      - name: milk-service
        image: gavya/milk-service:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: milk-service-config
        - secretRef:
            name: milk-service-secret
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
