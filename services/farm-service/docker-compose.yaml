version: "3.9"
services:
  farm-service:
    build:
      context: ../..
      dockerfile: services/farm-service/Dockerfile
    ports:
      - "8086:8080"
    environment:
      - SERVICE_NAME=farm-service
      - SERVER_ADDR=:8080
      - DATABASE_URL=postgres://postgres:secret@postgres:5432/dairy?sslmode=disable
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=dairy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
