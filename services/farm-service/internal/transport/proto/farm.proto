syntax = "proto3";

package farm.v1;

option go_package = "github.com/ppusapati/gavya/services/farm-service/internal/transport/proto;farmv1";

import "google/protobuf/timestamp.proto";

message Farm {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string code = 4;
  string address = 5;
  string city = 6;
  string state = 7;
  string country = 8;
  int32 capacity = 9;
  string manager_id = 10;
  string status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string created_by = 14;
  string updated_by = 15;
}

message FarmSection {
  string id = 1;
  string tenant_id = 2;
  string farm_id = 3;
  string name = 4;
  string section_type = 5;
  int32 capacity = 6;
  int32 current_occupancy = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string created_by = 10;
  string updated_by = 11;
}

message CreateFarmRequest {
  string tenant_id = 1;
  string name = 2;
  string code = 3;
  string address = 4;
  string city = 5;
  string state = 6;
  string country = 7;
  int32 capacity = 8;
  string manager_id = 9;
  string status = 10;
  string created_by = 11;
}

message CreateFarmResponse { Farm farm = 1; }

message GetFarmRequest {
  string id = 1;
  string tenant_id = 2;
}

message GetFarmResponse { Farm farm = 1; }

message ListFarmsRequest { string tenant_id = 1; }
message ListFarmsResponse { repeated Farm farms = 1; }

message UpdateFarmRequest {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string address = 4;
  string city = 5;
  string state = 6;
  string country = 7;
  string manager_id = 8;
  string status = 9;
  string updated_by = 10;
}

message UpdateFarmResponse { Farm farm = 1; }

message CreateFarmSectionRequest {
  string tenant_id = 1;
  string farm_id = 2;
  string name = 3;
  string section_type = 4;
  int32 capacity = 5;
  int32 current_occupancy = 6;
  string created_by = 7;
}

message CreateFarmSectionResponse { FarmSection section = 1; }

message ListFarmSectionsRequest {
  string tenant_id = 1;
  string farm_id = 2;
}

message ListFarmSectionsResponse { repeated FarmSection sections = 1; }

message UpdateFarmCapacityRequest {
  string id = 1;
  string tenant_id = 2;
  int32 capacity = 3;
  string updated_by = 4;
}

message UpdateFarmCapacityResponse { Farm farm = 1; }

service FarmService {
  rpc CreateFarm(CreateFarmRequest) returns (CreateFarmResponse);
  rpc GetFarm(GetFarmRequest) returns (GetFarmResponse);
  rpc ListFarms(ListFarmsRequest) returns (ListFarmsResponse);
  rpc UpdateFarm(UpdateFarmRequest) returns (UpdateFarmResponse);
  rpc CreateFarmSection(CreateFarmSectionRequest) returns (CreateFarmSectionResponse);
  rpc ListFarmSections(ListFarmSectionsRequest) returns (ListFarmSectionsResponse);
  rpc UpdateFarmCapacity(UpdateFarmCapacityRequest) returns (UpdateFarmCapacityResponse);
}
