# Sessions and tenant membership. Every other service reads who is
  # acting from the transport; this is what puts it there.
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  selector:
    app: identity-service
  ports:
  - port: 80
    targetPort: 8102
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service-config
data:
  SERVICE_NAME: identity-service
  SERVER_ADDR: ":8102"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
