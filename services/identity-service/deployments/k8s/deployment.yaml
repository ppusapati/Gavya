apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app: identity-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      annotations:
        # Discovered by a cluster Prometheus. The compose shape uses
        # deploy/monitoring/prometheus.yml instead; a test checks that a
        # service scraped in one shape is scraped in the other, because one
        # watched in testing and unwatched in production is the worse half.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8102"
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: gavya/identity-service:latest
        ports:
        - containerPort: 8102
        envFrom:
        - configMapRef:
            name: identity-service-config
        - secretRef:
            name: identity-service-secret
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8102
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8102
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
