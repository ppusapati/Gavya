apiVersion: v1
kind: Service
metadata:
  name: shadow-settlement-service
spec:
  selector:
    app: shadow-settlement-service
  ports:
  - port: 80
    targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-settlement-service-config
data:
  SERVICE_NAME: shadow-settlement-service
  # Where spans go. Empty turns tracing off and the platform is complete
  # without it, the same way it is complete without the ML tier.
  GAVYA_TRACE_ENDPOINT: "http://otel-collector:4318"
  SERVER_ADDR: ":8090"
  # Points at the Rust divergence service. Clearing this disables the advisory
  # call; deterministic classification is unaffected.
  # The ML tier, from ml/deployments/k8s/ml-tier.yaml. Every call through these
  # is advisory: emptying one turns that tier off and the service still starts,
  # still answers, and simply stops offering the advisory signal.
  #
  # Three of these four were empty and one was set, with nothing saying whether
  # that was a decision. compose wired all four. A deployment descriptor that
  # disagrees with the one beside it is not a configuration choice, it is drift.
  DIVERGENCE_ML_URL: "http://divergence-service:9104"
  DIVERGENCE_ML_TIMEOUT: "3"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shadow-settlement-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shadow-settlement-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
