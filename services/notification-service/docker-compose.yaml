version: "3.9"
services:
  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8092:8080"
    environment:
      - SERVICE_NAME=notification-service
      - SERVER_ADDR=:8080
      - DATABASE_URL=postgres://postgres:secret@postgres:5432/dairy?sslmode=disable
      # Not encrypted, and this says so. The PostgreSQL is a container beside this one on a private compose network. Point DATABASE_URL at a database anywhere else and this line has to go: set sslmode=verify-full instead.
      - GAVYA_INSECURE_DATABASE=plaintext-to-the-database-is-acceptable-here
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=dairy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
