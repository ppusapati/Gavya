version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dairy
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s; timeout: 5s; retries: 5

  cattle-service:
    build:
      context: ../..
      dockerfile: services/cattle-service/Dockerfile
    ports: ["8081:8080"]
    environment:
      SERVICE_NAME: cattle-service
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/dairy?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
