apiVersion: v1
kind: Service
metadata:
  name: canonical-service
spec:
  selector:
    app: canonical-service
  ports:
  - port: 80
    targetPort: 8093
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canonical-service-config
data:
  SERVICE_NAME: canonical-service
  SERVER_ADDR: ":8093"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: canonical-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canonical-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
