apiVersion: apps/v1
kind: Deployment
metadata:
  name: observation-service
  labels:
    app: observation-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: observation-service
  template:
    metadata:
      annotations:
        # Discovered by a cluster Prometheus. The compose shape uses
        # deploy/monitoring/prometheus.yml instead; a test checks that a
        # service scraped in one shape is scraped in the other, because one
        # watched in testing and unwatched in production is the worse half.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8092"
      labels:
        app: observation-service
    spec:
      containers:
      - name: observation-service
        image: gavya/observation-service:latest
        ports:
        - containerPort: 8092
        envFrom:
        - configMapRef:
            name: observation-service-config
        - secretRef:
            name: observation-service-secret
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8092
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8092
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
