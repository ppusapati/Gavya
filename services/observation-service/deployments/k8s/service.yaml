apiVersion: v1
kind: Service
metadata:
  name: observation-service
spec:
  selector:
    app: observation-service
  ports:
  - port: 80
    targetPort: 8092
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observation-service-config
data:
  SERVICE_NAME: observation-service
  SERVER_ADDR: ":8092"
  # Both ML endpoints are left unset by default. The service records every
  # observation without them; it simply states no confidence and flags nothing.
  UNCERTAINTY_ML_URL: ""
  ANOMALY_ML_URL: ""
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: observation-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: observation-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
