version: "3.9"
services:
  reporting-service:
    build: .
    ports:
      - "8096:8096"
    environment:
      SERVICE_NAME: reporting-service
      SERVER_ADDR: :8096
      DATABASE_URL: postgres://postgres:secret@postgres:5432/dairy?sslmode=disable
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dairy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
