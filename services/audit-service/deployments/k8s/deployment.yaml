apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  labels:
    app: audit-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      annotations:
        # Discovered by a cluster Prometheus. The compose shape uses
        # deploy/monitoring/prometheus.yml instead; a test checks that a
        # service scraped in one shape is scraped in the other, because one
        # watched in testing and unwatched in production is the worse half.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8097"
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: audit-service:latest
          ports:
            - containerPort: 8097
          envFrom:
            - configMapRef:
                name: audit-service-config
            - secretRef:
                name: audit-service-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8097
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8097
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
spec:
  selector:
    app: audit-service
  ports:
    - port: 8097
      targetPort: 8097
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-service-config
data:
  SERVICE_NAME: audit-service
  # Where spans go. Empty turns tracing off and the platform is complete
  # without it, the same way it is complete without the ML tier.
  GAVYA_TRACE_ENDPOINT: "http://otel-collector:4318"
  SERVER_ADDR: ":8097"
  # DATABASE_URL is deliberately not here.
  #
  # It was, complete with the password, in a ConfigMap — which is not a
  # secret store: it is readable by anything in the namespace that can read
  # ConfigMaps, it lands in `kubectl describe` output, and it is the first
  # thing copied into a git repository. It also carried sslmode=disable, so
  # the connection it described was unencrypted.
  #
  # It now comes from the Secret audit-service-secret, which the deployment
  # mounts beside this. Create it with a URL that verifies the server:
  #
  #   kubectl create secret generic audit-service-secret \
  #     --from-literal=DATABASE_URL='postgres://gavya_app:PASSWORD@postgres:5432/dairy?sslmode=verify-full&sslrootcert=/etc/ssl/certs/pg-ca.crt'
  #
  # Anything that can end up in plaintext — disable, allow, prefer, or no
  # sslmode at all — is refused at startup unless the deployment states the
  # case with GAVYA_INSECURE_DATABASE.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
