apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gateway-service-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: LoadBalancer
  selector:
    app: gateway-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
data:
  SERVICE_NAME: gateway-service
  SERVER_ADDR: ":8000"
  # Every service's Kubernetes Service exposes port 80, so the port is implicit.
  # The previous values pointed at each container's internal port, which is not
  # what the cluster DNS name resolves to.
  CATTLE_SERVICE_URL: http://cattle-service
  MILK_SERVICE_URL: http://milk-service
  BREEDING_SERVICE_URL: http://breeding-service
  HEALTH_SERVICE_URL: http://health-service
  FEED_SERVICE_URL: http://feed-service
  FARM_SERVICE_URL: http://farm-service
  CATTLE_MARKET_SERVICE_URL: http://cattle-market-service
  PRODUCT_CATALOG_SERVICE_URL: http://product-catalog-service
  INVENTORY_SERVICE_URL: http://inventory-service
  ORDER_SERVICE_URL: http://order-service
  BILLING_SERVICE_URL: http://billing-service
  TENANT_SERVICE_URL: http://tenant-service
  NOTIFICATION_SERVICE_URL: http://notification-service
  REPORTING_SERVICE_URL: http://reporting-service
  AUDIT_SERVICE_URL: http://audit-service
  FILE_SERVICE_URL: http://file-service
  INGESTION_SERVICE_URL: http://ingestion-service
  CANONICAL_SERVICE_URL: http://canonical-service
  OBSERVATION_SERVICE_URL: http://observation-service
  POOLING_SERVICE_URL: http://pooling-service
  BALANCE_SERVICE_URL: http://balance-service
  SHADOW_SETTLEMENT_SERVICE_URL: http://shadow-settlement-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
