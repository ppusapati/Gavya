syntax = "proto3";

package order.v1;

option go_package = "github.com/ppusapati/gavya/services/order-service/internal/transport/proto;orderv1";

import "google/protobuf/timestamp.proto";

message Order {
  string id = 1;
  string tenant_id = 2;
  string customer_id = 3;
  string order_number = 4;
  string status = 5;
  double sub_total = 6;
  double tax_amount = 7;
  double total_amount = 8;
  string currency = 9;
  string shipping_address = 10;
  string notes = 11;
  google.protobuf.Timestamp ordered_at = 12;
  google.protobuf.Timestamp delivered_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  string created_by = 16;
  string updated_by = 17;
}

message OrderItem {
  string id = 1;
  string tenant_id = 2;
  string order_id = 3;
  string sku_id = 4;
  string product_id = 5;
  double quantity = 6;
  double unit_price = 7;
  double total_price = 8;
  string status = 9;
}

message Invoice {
  string id = 1;
  string tenant_id = 2;
  string order_id = 3;
  string invoice_number = 4;
  string status = 5;
  double sub_total = 6;
  double tax_amount = 7;
  double total_amount = 8;
  string currency = 9;
  google.protobuf.Timestamp issued_at = 10;
  google.protobuf.Timestamp due_at = 11;
  google.protobuf.Timestamp paid_at = 12;
}

message CreateOrderRequest {
  string tenant_id = 1;
  string customer_id = 2;
  string currency = 3;
  string shipping_address = 4;
  string notes = 5;
  google.protobuf.Timestamp ordered_at = 6;
  string created_by = 7;
}

message CreateOrderResponse { Order order = 1; }

message GetOrderRequest {
  string id = 1;
  string tenant_id = 2;
}

message GetOrderResponse { Order order = 1; }

message AddOrderItemRequest {
  string tenant_id = 1;
  string order_id = 2;
  string sku_id = 3;
  string product_id = 4;
  double quantity = 5;
  double unit_price = 6;
  string created_by = 7;
}

message AddOrderItemResponse { OrderItem item = 1; }

message OrderActionRequest {
  string id = 1;
  string tenant_id = 2;
  string updated_by = 3;
}

message OrderActionResponse { Order order = 1; }

message GenerateInvoiceRequest {
  string order_id = 1;
  string tenant_id = 2;
  string created_by = 3;
}

message GenerateInvoiceResponse { Invoice invoice = 1; }

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc AddOrderItem(AddOrderItemRequest) returns (AddOrderItemResponse);
  rpc ConfirmOrder(OrderActionRequest) returns (OrderActionResponse);
  rpc CancelOrder(OrderActionRequest) returns (OrderActionResponse);
  rpc GenerateInvoice(GenerateInvoiceRequest) returns (GenerateInvoiceResponse);
}
