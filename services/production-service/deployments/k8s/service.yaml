# Batches, recall traversal and formulations.
apiVersion: v1
kind: Service
metadata:
  name: production-service
spec:
  selector:
    app: production-service
  ports:
  - port: 80
    targetPort: 8107
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: production-service-config
data:
  SERVICE_NAME: production-service
  # Where spans go. Empty turns tracing off and the platform is complete
  # without it, the same way it is complete without the ML tier.
  GAVYA_TRACE_ENDPOINT: "http://otel-collector:4318"
  SERVER_ADDR: ":8107"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: production-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: production-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
