# Nodes, movements and instruments: where the milk physically is.
apiVersion: v1
kind: Service
metadata:
  name: material-service
spec:
  selector:
    app: material-service
  ports:
  - port: 80
    targetPort: 8105
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: material-service-config
data:
  SERVICE_NAME: material-service
  SERVER_ADDR: ":8105"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: material-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: material-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
