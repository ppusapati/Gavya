apiVersion: apps/v1
kind: Deployment
metadata:
  name: cattle-market-service
  labels:
    app: cattle-market-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cattle-market-service
  template:
    metadata:
      annotations:
        # Discovered by a cluster Prometheus. The compose shape uses
        # deploy/monitoring/prometheus.yml instead; a test checks that a
        # service scraped in one shape is scraped in the other, because one
        # watched in testing and unwatched in production is the worse half.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
      labels:
        app: cattle-market-service
    spec:
      containers:
      - name: cattle-market-service
        image: gavya/cattle-market-service:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: cattle-market-service-config
        - secretRef:
            name: cattle-market-service-secret
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cattle-market-service
spec:
  selector:
    app: cattle-market-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cattle-market-service-config
data:
  SERVICE_NAME: cattle-market-service
  # Where spans go. Empty turns tracing off and the platform is complete
  # without it, the same way it is complete without the ML tier.
  GAVYA_TRACE_ENDPOINT: "http://otel-collector:4318"
  SERVER_ADDR: ":8080"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cattle-market-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cattle-market-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
