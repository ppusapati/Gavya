# Run the gate, on every push and every pull request.
#
# scripts/check-all.sh has been the whole of this repository's quality control
# for as long as there has been one, and nothing ran it. It ran when somebody
# remembered, on a machine whose PostgreSQL happened to be up, with whatever was
# in the Go build cache. A check that depends on being remembered is one that
# stops happening the week everyone is busy, and the week everyone is busy is
# when a change most needs it.
#
# One job, running the same script a person runs, rather than a reimplementation
# of it in YAML. A pipeline that lists its own steps drifts from the script, and
# then "it passes locally" and "it passes in CI" are two different claims about
# two different things. There is a test that fails the build if this workflow
# stops calling that script.
#
# ---------------------------------------------------------------------------
# WHY THE FIRST THIRTY-TWO RUNS OF THIS WORKFLOW EXECUTED NOTHING
# ---------------------------------------------------------------------------
#
# Kept because it took a day to establish and would take another day to
# establish again, and because the same symptom has an entirely different cause
# now that this repository is public.
#
# Every run from the first on 14 September 2026 to run 32 on 23 September failed
# within a few seconds, and not one executed a step. What the API said:
#
#   runner_id: 0, runner_name: "", runner_group_id: 0, runner_group_name: ""
#   job logs: HTTP 404 — there were none
#   check run output: empty
#   billable time: total_ms 0, on every job of every run
#
# Zero billable milliseconds was the decisive one. The jobs were created, marked
# started and failed without a runner ever being assigned, so nothing ran and
# nothing was charged. No edit to this file would have changed it: the YAML is
# valid — an invalid one is a startup_failure and says so — and ubuntu-24.04 is
# a current GitHub-hosted label.
#
# The repository was private, on a personal account. Private repositories bill
# Actions minutes against the account's allowance, and when that allowance is
# spent with no spending limit raised, or a payment method has failed, GitHub
# does exactly this: it accepts the workflow, creates the jobs, and refuses to
# give them a machine.
#
# It was made public on 24 September 2026, which is the one remedy that costs
# nothing: public repositories get GitHub-hosted runners at no charge and no
# limit. The others were a spending limit, a payment method, or a self-hosted
# runner. The price paid instead is that a co-operative's source, its schemas
# and its deployment manifests are now readable by anyone — no credential,
# because none is committed, but the whole shape of the platform.
#
# So the runs from here on are the first that can reach a machine, and they are
# the first time scripts/check-all.sh and the thirty Docker builds have run
# anywhere but a developer's container. Expect the first ones to find things.
# Every "gate green" before this date means the script passed where the change
# was written, which is a weaker claim than a green tick.
#
# If jobs ever fail in seconds with total_ms 0 again, this is no longer the
# explanation — a public repository is not billed. Look at concurrency limits
# or a repository-level Actions setting instead.
name: check

on:
  push:
    branches: ['**']
  pull_request:
  # So the fix can be tested without inventing a commit to push.
  #
  # Whoever raises the spending limit wants to know within a minute whether it
  # worked, and the alternative is an empty commit on a branch — which is a
  # thing people do, and then leave behind.
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: scripts/check-all.sh
    runs-on: ubuntu-24.04
    # The end-to-end suite builds thirty binaries and drives them over real HTTP,
    # and the upgrade test builds a database per service from every committed
    # version of its schema. Generous rather than optimistic: a timeout that
    # trips on a slow runner teaches people to re-run rather than to look.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        env:
          # No password, reachable only from this job's network. The platform's
          # own credential handling is exercised by its tests, not by the CI
          # database.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade test applies every committed version of each schema in
          # order, so it needs the history. A shallow clone makes it silently
          # compare one version against itself.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Give PostgreSQL the limit the platform declares
        # Both compose files set max_connections=300, for the arithmetic
        # TestThePoolsFitTheDatabase spells out: twenty-eight pools of
        # tenantdb.MaxConns, plus headroom. This server was on PostgreSQL's
        # default of 100, and the suite runs the twenty-eight services plus two
        # modulith processes against it — which failed with "remaining connection
        # slots are reserved for roles with the SUPERUSER attribute" from every
        # test after the modulith started.
        #
        # Done this way because a service container takes no command: the setting
        # needs a restart, so it is written and the container bounced. Ugly, and
        # the alternative is a CI database that cannot hold what the deployment
        # declares — which would mean the gate passes here and the platform runs
        # out of connections in a cluster.
        run: |
          id="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)"
          test -n "$id" || { echo "no postgres container to configure"; exit 1; }
          docker exec "$id" psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart "$id"
          for _ in $(seq 1 30); do
            if docker exec "$id" pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$id" psql -U postgres -tAc "SHOW max_connections"

      - name: Install the PostgreSQL client
        # The backup round trip shells out to pg_dump, pg_dumpall, pg_restore and
        # psql, and skips loudly without them — which would mean the one test
        # that can say "a backup restores" quietly did not run. Version 16 to
        # match the server: pg_dump refuses a server newer than itself.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Install golangci-lint
        # The gate skips linting, by name, when this is absent — so without this
        # step CI would run every other check and quietly not this one, which is
        # the difference between a gate and most of a gate. Built from source
        # against the workspace's Go version on purpose: the released binaries
        # are built with an older toolchain and refuse a module targeting a newer
        # one, which is how this first failed.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the console's dependencies
        # The gate typechecks the console when web/node_modules is there and
        # skips it, by name, when it is not — an install mid-run is not the
        # gate's job. Nothing did the install, so the first green run on
        # 24 September 2026 reported "all checks passed" having never compiled
        # a line of the console. This is the step that was missing.
        #
        # npm ci, not npm install: it installs what package-lock.json pins and
        # fails if the lock and the manifest disagree, where install would
        # quietly rewrite the lock and typecheck against dependencies nobody
        # chose.
        run: npm ci --prefix web

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ml

      - name: Fetch the Rust dependencies
        # The gate builds the ML tier with --offline, deliberately: a build that
        # reaches the network mid-run is one that fails for a reason that has
        # nothing to do with the change. Offline needs the registry populated
        # first, which is this step's whole job.
        run: cargo fetch --manifest-path ml/Cargo.toml

      - name: Run the gate
        env:
          # The %s is where each service's own database name goes. A DSN without
          # it silently puts every service in one database and the suite still
          # passes, which is why the script refuses one.
          TEST_DATABASE_DSN: 'postgres://postgres@localhost:5432/%s?sslmode=disable'
          # The console's typecheck skips itself when node_modules is absent,
          # which is right on a laptop and wrong under a tick. This makes the
          # skip a failure, so deleting the install step above fails the build
          # rather than quietly going back to not checking the console.
          GAVYA_REQUIRE_WEB_CHECK: '1'
        run: bash scripts/check-all.sh

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Scan every module
        # Separate from the gate because it asks a question the gate does not:
        # whether a dependency has a known advisory that this code actually
        # reaches. It is its own job so a new advisory does not read as a
        # failure of the change that happened to be pushed that morning.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          fail=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            echo "==> ${dir#"$PWD/"}"
            ( cd "$dir" && govulncheck ./... ) || fail=1
          done
          exit $fail

  images:
    name: docker build
    runs-on: ubuntu-24.04
    # The Rust images compile the ML workspace with link-time optimisation and
    # one codegen unit, and thirty Go images compile a thirty-five module
    # workspace. Generous for the same reason the gate's is.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build every image the deployments reference
        # Nothing had ever built one of these. `go build` in the gate stood in
        # for it, and the two are not the same claim: the gate compiles a
        # package, an image also has to say which files it needs and where they
        # sit. services/modulith/Dockerfile — the shape that ships — copied
        # go.work and none of the three modules go.work lists, so it stopped at
        # the first instruction. It had been that way since it was written.
        #
        # A glob rather than a list, because a list is a thing to forget: a
        # thirty-first service with a Dockerfile is built here the day it
        # appears.
        run: |
          fail=0
          for f in services/*/Dockerfile; do
            svc="$(basename "$(dirname "$f")")"
            echo "::group::$svc"
            docker build -f "$f" -t "gavya/$svc:ci" . || fail=1
            echo "::endgroup::"
          done
          for d in ml/*/; do
            crate="$(basename "$d")"
            grep -q '^\[\[bin\]\]' "$d/Cargo.toml" 2>/dev/null || continue
            echo "::group::$crate"
            docker build -f ml/Dockerfile --build-arg "SERVICE=$crate" \
              -t "gavya/$crate:ci" ml || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Say what each image listens on and what it weighs
        # Not a check — the checks are in Go, beside the rest of the deployment
        # ones. This is so that a person reading a failed run can see whether
        # the image they are looking at is the size they expect, which is the
        # first thing anybody asks of a distroless build.
        if: always()
        run: docker images --filter 'reference=gavya/*:ci' --format 'table {{.Repository}}\t{{.Size}}'
