# What scrapes the platform.
#
# Every service has served /metrics for a long time and nothing read it, which
# made the whole of the platform's observability a page that existed. This is the
# reader.
#
# The targets are written out rather than discovered, for the same reason the
# authorization route table is: this deployment shape has a fixed, known set of
# services on fixed, known ports, and a list checked against the code is better
# than a rule that silently stops matching. The test in
# services/gateway-service/handler compares this file against
# libs/integrity/ports and fails the build when a service is added and not
# scraped — which is this file's own failure mode, one level up.
#
# Kubernetes does not use this file: the pods carry prometheus.io annotations and
# a cluster Prometheus discovers them. The same test checks both, because a
# service scraped under compose and not under Kubernetes is one that is watched
# in testing and unwatched in production.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: gavya

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gavya-audit
    static_configs:
      - targets: ['audit-service:8100']
  - job_name: gavya-balance
    static_configs:
