# What scrapes the platform.
#
# Every service has served /metrics for a long time and nothing read it, which
# made the whole of the platform's observability a page that existed. This is the
# reader.
#
# THE PORTS HERE ARE THE CONTAINER PORTS, NOT THE ONES IN libs/integrity/ports.
#
# That distinction cost this file a rewrite and is worth stating plainly, because
# getting it wrong produces monitoring that is switched on and blind. The ports
# registry is what a service listens on when run directly on a developer's
# machine, where everything shares one host and needs distinct numbers. Under
# compose each service is alone in its container and listens on 8080, and the
# registry number is what is published to the *host* — and for several services
# not even that: audit-service is 8100 in the registry and published on 8094.
#
# Prometheus runs inside the compose network and reaches a service by its
# container name on its container port. The first version of this file used the
# registry and would have scraped a port nothing listens on, for every service,
# and every target would have read as down — which is the failure this file
# exists to prevent, committed into the file itself.
#
# So the test in services/gateway-service/handler compares these targets against
# docker-compose.yaml rather than against the registry, and a service whose
# listening port changes fails the build.
#
# Kubernetes does not use this file: the pods carry prometheus.io annotations
# naming their own containerPort, and a cluster Prometheus discovers them.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: gavya

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gavya-audit
    static_configs:
      - targets: ['audit-service:8080']
  - job_name: gavya-balance
    static_configs:
      - targets: ['balance-service:8095']
