# What is worth waking somebody for.
#
# Every service served /metrics and nothing scraped them, so the platform's
# observability was a page that existed and nobody read. An outage was noticed by
# a society telephoning, which is a monitoring system with a very long scrape
# interval and a very unhappy customer in the loop.
#
# Two rules about what is here.
#
# Every expression names a metric this platform actually emits. That sounds like
# it goes without saying and it is the single easiest thing to get wrong: an
# alert on a metric with a plausible name that nothing publishes never fires, and
# an alert that never fires is indistinguishable from a system that never breaks.
# A test scrapes a live metrics handler and fails the build if any name here is
# not in what came back.
#
# Every alert says what a person should do about it. An alert nobody knows how to
# act on gets silenced, and the silence outlives the reason for it.
groups:
  - name: gavya-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"gavya-.*"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} has not answered a scrape for two minutes'
          description: >-
            The process is gone or unreachable. If this is one instance of
            several the platform is degraded; if it is the only one, that
            service's procedures are all failing. Check the pod's restarts and
            its logs before restarting it, because a crash loop that is restarted
            without being read loses the reason it was crashing.

      - alert: ServiceRestartLoop
        # Uptime resets to zero when a process restarts; several resets inside a
        # quarter of an hour is a service that cannot stay up.
        expr: resets(gavya_uptime_seconds[15m]) > 2
        for: 5m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} has restarted more than twice in fifteen minutes'
          description: >-
            Readiness is deliberately the only probe tied to dependencies here;
            liveness is unconditional so that a database outage cannot turn into
            a crash loop across the platform. A loop therefore means the process
            is failing at startup or panicking, and the logs from before the last
            restart are the ones that say why.

  - name: gavya-correctness
    rules:
      - alert: ProceduresFailing
        # Five per cent of a procedure's calls failing with a server error. Per
        # procedure and not per service, because "the platform is erroring" is
        # never the useful form of that sentence: one broken procedure among
        # forty is invisible in a service-wide rate.
        expr: |
          sum by (job, procedure) (rate(gavya_requests_total{code=~"5.."}[5m]))
            /
          sum by (job, procedure) (rate(gavya_requests_total[5m]))
            > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.procedure }} is failing for more than one call in twenty'
          description: >-
            A server error is the platform's fault by definition: the codes are
            chosen by cause, so anything a caller could fix arrives as
            invalid_argument or failed_precondition and is not counted here. If
            this is a collection procedure, producers are being turned away and
            their milk is being written on paper.

      - alert: EverythingRefused
        # A service answering nothing but errors. Separate from the rate above
        # because it wants a much shorter fuse: a service that has never served a
        # successful request since it started is usually misconfigured rather
        # than failing, and the deployment that did it is still fresh in
        # somebody's mind.
        expr: |
          sum by (job) (rate(gavya_requests_total{code=~"5.."}[5m]))
            /
          sum by (job) (rate(gavya_requests_total[5m]))
            > 0.95
        for: 2m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} is failing almost every request'
          description: >-
            Nearly always a dependency it cannot reach or a setting it was given
            wrongly. /readyz asks its dependencies and will say which; check that
            before assuming the service itself is broken.

  - name: gavya-latency
    rules:
      - alert: ProcedureSlow
        # The ninety-ninth percentile above a second.
        #
        # The threshold is a long way above anything measured: e2e/load_test.go
        # put the ninety-ninth percentile between 7ms and 28ms at ten to fifty
        # booths recording at once. A second is not "slower than usual", it is
        # somebody at a booth waiting and wondering whether to press it again.
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, procedure, le) (rate(gavya_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.procedure }} is taking more than a second at the ninety-ninth percentile'
          description: >-
            A mean would not show this. A stall that hits one call in a hundred
            moves the mean by a few milliseconds and is the whole of what the
            person it happened to experienced. Look at whether the database is
            the constraint before adding instances: the collection path is bound
            by its database, so more service instances make the queue longer
            rather than shorter.

      - alert: RequestsPilingUp
        # In-flight requests climbing and staying there.
        #
        # The load measurement is what makes this number mean something: at fifty
        # booths recording at once the platform sustained about 2,800 collections
        # a second with roughly fifty in flight. Two hundred sustained is four
        # times the concurrency that was measured as comfortable.
        expr: gavya_requests_in_flight > 200
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} has more than two hundred requests in flight'
          description: >-
            Work is arriving faster than it is finishing. Either the morning is
            bigger than the deployment was sized for, or something downstream has
            slowed and every caller is waiting on it. The per-caller rate limit
            bounds one client, not the total.

  - name: gavya-the-database
    rules:
      - alert: PoolNearlyExhausted
        # Connections in use against connections allowed. Per job, because a
        # single service saturating its pool is the ordinary case — a report that
        # scans a fortnight — and the platform-wide number would hide it.
        expr: |
          gavya_db_pool_acquired_conns / gavya_db_pool_max_conns > 0.9
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is holding more than nine tenths of its database connections'
          description: >-
            Every request beyond this waits for a connection before it does
            anything, so latency rises for work that is not itself slow. Either
            the service is doing more than the pool was sized for, or something
            is holding connections it is not using — a transaction left open, a
            query waiting on a lock. Look at ProcedureSlow beside this: if one
            procedure got slow first, the pool is the symptom.

      - alert: CallersWaitingForConnections
        # The sharper signal, and the reason the pool statistics are counters.
        # Depth above is a level and can sit high on a busy morning without
        # anything being wrong; this is the rate at which callers arrive and find
        # nothing free, which is work being delayed rather than work being done.
        expr: |
          rate(gavya_db_pool_empty_acquires_total[5m]) > 10
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is waiting for a database connection more than ten times a second'
          description: >-
            The pool is the constraint. Raising it is not automatically the
            answer: the collection path is bound by the database, so more
            connections against a database already at its service rate makes the
            queue longer rather than shorter. Check whether the database is
            saturated first, and note that the per-service pool size and the
            server's max_connections are one arithmetic — see
            libs/integrity/tenantdb/limits.go.

      - alert: AcquiresBeingAbandoned
        # A caller that gave up waiting. This is the failure the two above are
        # trying to predict: by the time it fires, requests are being refused.
        expr: |
          rate(gavya_db_pool_canceled_acquires_total[5m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} has requests giving up before they reach the database'
          description: >-
            A request whose context expired while waiting for a connection. It
            never ran a query, so nothing was half-done — but the caller was
            turned away, and if this is a collection procedure that is a booth
            being told to try again. Check PoolNearlyExhausted and
            CallersWaitingForConnections above for which of the two it is.

  - name: gavya-the-quiet-failures
    rules:
      - alert: NotificationOutboxStalled
        # Not depth — age. A deep outbox that is draining is a busy fortnight; an
        # outbox whose oldest message has been waiting a quarter of an hour is a
        # sweep that has stopped, whatever its depth.
        expr: gavya_notification_outbox_oldest_seconds > 900
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'The oldest undelivered notification has been waiting more than fifteen minutes'
          description: >-
            Money events queue a message in the same transaction as the change
            and a sweep delivers it. If the sweep has stopped, every payable
            held, approved and paid is still recorded correctly and nobody is
            being told about any of them — which looks like a working platform
            from every other angle. Check NOTIFICATION_URL and whether
            notification-service is answering.

      - alert: OutboxDepthUnknown
        # -1 is what the gauge reports before its first reading and after a
        # reading that failed. Distinguished from zero deliberately: zero is the
        # same number as "the outbox is empty", which is the reassuring answer
        # and the wrong one.
        expr: gavya_notification_outbox_depth == -1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'The outbox depth has not been read for ten minutes'
          description: >-
            The reader could not reach the database, or has stopped. The alert
            above cannot fire while this is true, so this is the one that says
            the other one is blind.

      - alert: AuditChainBroken
        expr: gavya_audit_chain_intact == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: 'A tenant''s audit trail no longer verifies'
          description: >-
            The trail is hash-chained so that a row altered after the fact can be
            shown to have been altered. This says one has been. The trail is
            append-only and enforced by a trigger, so the ways this happens are a
            database somebody reached around the application to edit, or
            corruption. Do not restart anything; the logs name the row and the
            tenant, and the trail is the evidence.

      - alert: AuditChainUnchecked
        # The chain is walked hourly. Three hours without one is the walk having
        # stopped, and a chain nobody has verified since Friday is a claim rather
        # than evidence — which is the state this was in before it was watched.
        expr: gavya_audit_chain_checked_seconds_ago > 10800 or gavya_audit_chain_checked_seconds_ago == -1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'The audit chain has not been verified for three hours'
          description: >-
            The walk runs hourly inside audit-service. If it has stopped, the
            AuditChainBroken alert above cannot fire, so this is the one that
            says that one is blind.

# WHAT THIS DOES NOT WATCH, AND SHOULD
#
# Recorded because a gap nobody wrote down is one nobody closes.
#
#   - What the database itself is doing: replication lag, disk, checkpoints,
#     locks, the size of anything. The usual exporter covers it and no deployment
#     here runs one. Still deliberately not alerted on from here, and for the
#     unchanged reason: the test beside these rules verifies that every metric an
#     alert names is one a live handler actually emits, and it cannot do that for
#     an exporter that is not running.
#
#     Connections used to be on that list and are not any more, because that
#     reason never covered them. They are read off a pool the service is already
#     holding, so a live handler does emit them and the check can see them — see
#     the gavya-the-database group above and libs/integrity/tenantdb/watch.go.
#     The gap this closed was not a small one: twenty-eight pools sized by a
#     default nobody chose, against a server limit nobody set.
#   - Anything the platform does that is not a request and not one of the ones
#     above. The registry in libs/integrity/observe is how a service publishes
#     such a thing — Publish for a number that goes both ways, PublishCounter for
#     one that only rises — and it is worth reaching for before writing an alert
#     on a number nobody is emitting.
#
# The settlement outbox and the audit chain were on this list and are not any
# more; they are the group above. Both needed a metric that did not exist, which
# is why they sat here: a service could count requests and could say nothing
# about its own work. Tracing was here too and is in libs/integrity/tracing now,
# and it reaches into the database rather than stopping at it.
