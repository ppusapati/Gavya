[workspace]
resolver = "2"
members = [
    "mlcore",
    "anomaly-service",
    "uncertainty-service",
    "reconciliation-service",
    "divergence-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Proprietary"

[workspace.dependencies]
mlcore = { path = "mlcore" }
axum = { version = "0.8", features = ["json", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
