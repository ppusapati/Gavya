# Rust ML tier.
#
# These hold no state and reach no database, so they scale purely on request
# load and a restart costs nothing. Every caller treats them as advisory: if a
# pod is unavailable the Go services still produce a complete answer, which is
# why these carry no PodDisruptionBudget and no minimum beyond ordinary
# availability.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-service
  labels:
    app: anomaly-service
    tier: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anomaly-service
  template:
    metadata:
      labels:
        app: anomaly-service
        tier: ml
    spec:
      containers:
      - name: anomaly-service
        image: gavya/anomaly-service:latest
        ports:
        - containerPort: 9101
        env:
        - name: LISTEN_ADDR
          value: "0.0.0.0:9101"
        - name: LOG_LEVEL
          value: "info"
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9101
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9101
          initialDelaySeconds: 5
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "1000m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-service
  labels:
    tier: ml
  annotations:
    # Scores collection measurements against their own history.
    gavya.in/model-version: "anomaly-robust-z-1.0.0"
spec:
  selector:
    app: anomaly-service
  ports:
  - port: 9101
    targetPort: 9101
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anomaly-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anomaly-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
